services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: permissioning
      POSTGRES_USER: permissioning
      POSTGRES_PASSWORD: permissioning_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permissioning -d permissioning"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgres://permissioning:permissioning_dev@postgres:5432/permissioning?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
